[project]
name = "iotamine-mcp"
version = "0.2.2"
description = "MCP server for the Iotamine cloud VPS platform — manage VPS instances, billing, and infrastructure from any MCP-compatible client (Claude Desktop, Claude Code, Cursor, ...)."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.0,<3",
    "httpx>=0.27",
]

[project.scripts]
iotamine-mcp = "iotamine_mcp.__main__:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/iotamine_mcp"]
